openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: firms
    description: Firm overrides
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /firms-overrides:
    get:
      operationId: getFirmsOverrides
      tags: [firms]
      summary: Get firm overrides
      description: Returns admin-configured overrides keyed by firm slug
      responses:
        "200":
          description: Map of slug -> override
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/FirmOverride"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FirmOverride:
      type: object
      properties:
        slug:
          type: string
        affiliateUrl:
          type: string
          nullable: true
        promoCode:
          type: string
          nullable: true
        promoPercent:
          type: number
          nullable: true
        promoLabel:
          type: string
          nullable: true
        discountPercent:
          type: integer
          nullable: true
      required:
        - slug

